apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "secret"
  MYSQL_PASSWORD: "secret"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/part-of: todo-app
data:
  MYSQL_HOST: "mysql"
  MYSQL_USER: "root"
  MYSQL_DB: "todos"
  PORT: "3000"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-mysql-pvc
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard       # Kind 기본 스토리지 클래스 (rancher.io/local-path)
  resources:
    requests:
      storage: 1Gi                 # 로컬 실습용 크기

---
apiVersion: v1
kind: Pod
metadata:
  name: mysql
  labels:
    app: mysql
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  restartPolicy: Always
  containers:
    - name: mysql
      image: mysql:9.3
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 3306
          name: mysql
      env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: MYSQL_DB
      volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
      resources:
        requests:
          cpu: "250m"
          memory: "512Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      readinessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 15
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command:
            - mysqladmin
            - ping
            - -h
            - localhost
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
  volumes:
    - name: mysql-data
      persistentVolumeClaim:
        claimName: todo-mysql-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app.kubernetes.io/name: getting-started-todo-app
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  # [GKE 무중단 롤링 업데이트 전략]
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
        app.kubernetes.io/name: getting-started-todo-app
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for MySQL service at mysql:3306..."
              until nc -z -v -w3 mysql 3306; do
                echo "MySQL is not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "MySQL is available!"
      containers:
        - name: backend
          # dockerhub 전용 프로덕션 이미지
          image: todo-backend:prod
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-db-secret
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
